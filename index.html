<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A2864" />
    <title>SmartX ERP · Dairy plant operating system</title>
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var p = localStorage.getItem('kshira-palette');
          d.dataset.palette = ['blue','milk','ghee','lime','saffron','rose','graphite','teal','emerald','onyx','crimson','mocha'].indexOf(p) > -1 ? p : 'blue';
          var t = localStorage.getItem('kshira-theme');
          var dark = t ? t === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) d.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
